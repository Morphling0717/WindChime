<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src blob: data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>WindChime Display</title><style>html,body,#root{width:100%;height:100%;margin:0;padding:0}body{background:transparent;overflow:hidden}#root{position:relative;display:flex;align-items:stretch;justify-content:stretch}#root>.wc-display{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;margin:0!important;flex:1 1 auto}.wc-test-drag{position:fixed;inset:0;z-index:18;-webkit-app-region:drag;cursor:move}.wc-test-guide{position:fixed;inset:0;pointer-events:none;z-index:20;border:2px dashed rgba(45,226,230,.85);border-radius:16px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}.wc-test-guide i{position:absolute;width:18px;height:18px;border:3px solid #2de2e6}.wc-test-guide .tl{top:6px;left:6px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.wc-test-guide .tr{top:6px;right:6px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}.wc-test-guide .bl{bottom:6px;left:6px;border-right:0;border-top:0;border-radius:0 0 0 6px}.wc-test-guide .br{bottom:6px;right:6px;border-left:0;border-top:0;border-radius:0 0 6px 0}.wc-test-size{position:fixed;right:14px;bottom:14px;z-index:21;pointer-events:none;padding:5px 11px;border-radius:999px;background:rgba(8,18,28,.82);border:1px solid rgba(45,226,230,.65);color:#aef8fa;font:600 13px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.35)}</style></head><body><div id="root"></div><script src="display.js"></script></body></html>
