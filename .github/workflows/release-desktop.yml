name: release-desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22 LTS (required by Electron packaging toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install and verify shared @windchime/embed package
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run pack:check

      - name: Install and test WindChime Desktop
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

      - name: Package Windows installer and portable ZIP
        working-directory: apps/desktop
        shell: pwsh
        env:
          WINDCHIME_BUILD_ROOT: C:\WindChimeBuild
          ELECTRON_CACHE: C:\WindChimeBuild\electron-cache
          ELECTRON_BUILDER_CACHE: C:\WindChimeBuild\builder-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:WINDCHIME_BUILD_ROOT, $env:ELECTRON_CACHE, $env:ELECTRON_BUILDER_CACHE | Out-Null
          node scripts/make.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-portable.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Optional Authenticode code signing (enabled when WIN_CERT_BASE64 secret is configured)
        working-directory: apps/desktop
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT_BASE64 -or -not $env:WIN_CERT_PASSWORD) {
            Write-Host 'WIN_CERT_BASE64/WIN_CERT_PASSWORD not configured; skipping Authenticode signing.'
            exit 0
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $relDir = "out\releases\$version"
          $setup = "$relDir\WindChime-Setup-$version.exe"
          $zip = "$relDir\WindChime-win32-x64-$version.zip"
          $pfxPath = "$env:RUNNER_TEMP\windchime-sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found on Windows runner' }
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $setup
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $hashes = @(
              "$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant())  WindChime-win32-x64-$version.zip",
              "$((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant())  WindChime-Setup-$version.exe"
            )
            Set-Content -Path "$relDir\SHA256SUMS.txt" -Value ($hashes -join "`n") -NoNewline
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }

      - name: Publish GitHub Release
        working-directory: apps/desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          $relDir = "out\releases\$version"
          $sums = Get-Content "$relDir\SHA256SUMS.txt" -Raw
          $changelogSection = ''
          $changelogPath = Join-Path (Resolve-Path '..\..') 'CHANGELOG.md'
          if (Test-Path $changelogPath) {
            $rawLog = Get-Content $changelogPath -Raw -Encoding UTF8
            $m = [regex]::Match($rawLog, '(?ms)^##\s+' + [regex]::Escape($version) + '\b[^\r\n]*\r?\n(.*?)(?=^##\s+|\z)')
            if ($m.Success) { $changelogSection = $m.Groups[1].Value.Trim() }
          }
          $changelogBlock = if ($changelogSection) { "$changelogSection`n`n---`n" } else { '' }
          $notes = @"
          ## 风铃 WindChime $version

          $changelogBlock- 支持从旧版直接运行安装程序覆盖升级，已有网站连接密钥、热键、深色模式与本地配置完整保留。
          - **Windows SmartScreen 提示说明**：若首次安装出现「Windows 已保护你的电脑」，点击「更多信息 → 仍要运行」即可，并可对照下方 ``SHA256SUMS.txt`` 校验文件完整性。

          ### SHA-256 校验值
          ``````text
          $sums
          ``````
          "@
          $notesFile = "$relDir\auto-release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; updating assets and notes to keep Release and mirror hashes in sync."
            gh release upload $tag `
              "$relDir\WindChime-Setup-$version.exe" `
              "$relDir\WindChime-win32-x64-$version.zip" `
              "$relDir\SHA256SUMS.txt" `
              --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag `
              "$relDir\WindChime-Setup-$version.exe" `
              "$relDir\WindChime-win32-x64-$version.zip" `
              "$relDir\SHA256SUMS.txt" `
              --title "风铃 $version" `
              --notes-file $notesFile `
              --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Sign and publish China-mirror update feed to windchime.uliuli.cn
        working-directory: apps/desktop
        shell: pwsh
        env:
          WINDCHIME_UPDATE_PRIVATE_KEY: ${{ secrets.WINDCHIME_UPDATE_PRIVATE_KEY }}
          MIA_SSH_KEY: ${{ secrets.MIA_SSH_KEY }}
          MIA_SSH_HOST: ${{ secrets.MIA_SSH_HOST }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if (-not $env:WINDCHIME_UPDATE_PRIVATE_KEY -or -not $env:MIA_SSH_KEY -or -not $env:MIA_SSH_HOST) {
            Write-Host 'China mirror secrets not configured; skipping windchime.uliuli.cn publish.'
            exit 0
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          $relDir = "out\releases\$version"
          $setup = "$relDir\WindChime-Setup-$version.exe"
          $manifest = "$relDir\latest.json"
          $notesFile = "$relDir\auto-release-notes.md"
          $expectedSha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $releaseUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/WindChime-Setup-$version.exe"

          node scripts/generate-update-manifest.cjs --version $version --setup $setup --notes-file $notesFile --out $manifest --title "风铃 $version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $keyPath = "$env:RUNNER_TEMP\mia_deploy_key"
          [IO.File]::WriteAllText($keyPath, $env:MIA_SSH_KEY.Replace("`r`n", "`n") + "`n", [Text.UTF8Encoding]::new($false))
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):R" | Out-Null
          try {
            $sshOpts = @('-i', $keyPath, '-o', 'StrictHostKeyChecking=accept-new', '-o', 'BatchMode=yes')
            $remoteHost = "root@$($env:MIA_SSH_HOST)"

            # Fast path: pull the just-published installer directly on the HK mirror from GitHub Release and verify SHA-256.
            # Encode as LF-only UTF-8 Base64 so Windows PowerShell never appends a trailing CR (\r) to the piped bash script.
            $pullScript = @(
              'set -euo pipefail'
              'version="$1"'
              'expected_sha="$2"'
              'release_url="$3"'
              'mkdir -p /opt/windchime-updates'
              'tmp="/opt/windchime-updates/WindChime-Setup-${version}.exe.dl"'
              'target="/opt/windchime-updates/WindChime-Setup-${version}.exe"'
              'rm -f "$tmp"'
              'curl -fSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o "$tmp" "$release_url"'
              'actual="$(sha256sum "$tmp" | awk ''{print tolower($1)}'' )"'
              'if [ "$actual" != "$expected_sha" ]; then'
              '  echo "SHA-256 mismatch: $actual != $expected_sha" >&2'
              '  rm -f "$tmp"'
              '  exit 42'
              'fi'
              'chmod 644 "$tmp"'
              'mv "$tmp" "$target"'
            ) -join "`n"
            $pullB64 = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($pullScript + "`n"))
            Write-Host "Pulling WindChime-Setup-$version.exe directly onto HK mirror from $releaseUrl ..."
            ssh @sshOpts $remoteHost "printf '%s' '$pullB64' | base64 -d | bash -s -- '$version' '$expectedSha' '$releaseUrl'"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Direct pull on HK mirror failed (exit $LASTEXITCODE); falling back to scp upload..."
              scp @sshOpts $setup "${remoteHost}:/opt/windchime-updates/WindChime-Setup-$version.exe.tmp"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              ssh @sshOpts $remoteHost "chmod 644 /opt/windchime-updates/WindChime-Setup-$version.exe.tmp && mv /opt/windchime-updates/WindChime-Setup-$version.exe.tmp /opt/windchime-updates/WindChime-Setup-$version.exe"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            # Upload tiny metadata files, atomically flip latest.json + symlink, and clean old/malformed installer files.
            scp @sshOpts "$relDir\SHA256SUMS.txt" "${remoteHost}:/opt/windchime-updates/"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            scp @sshOpts $manifest "${remoteHost}:/opt/windchime-updates/latest.json.tmp"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ssh @sshOpts $remoteHost "test -f /opt/windchime-updates/WindChime-Setup-$version.exe && find /opt/windchime-updates -maxdepth 1 -name 'WindChime-Setup-*.exe?*' ! -name '*.tmp' ! -name '*.dl' -delete && mv /opt/windchime-updates/latest.json.tmp /opt/windchime-updates/latest.json && ln -sf WindChime-Setup-$version.exe /opt/windchime-updates/WindChime-Setup-latest.exe && ls -t /opt/windchime-updates/WindChime-Setup-[0-9]*.exe | tail -n +3 | xargs -r rm -f"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # Verify live public HTTPS mirror returns 200 with exact Content-Length before marking release green.
            $liveHead = Invoke-WebRequest -Method Head -Uri "https://windchime.uliuli.cn/updates/WindChime-Setup-$version.exe" -UseBasicParsing
            $liveLen = [int64]($liveHead.Headers['Content-Length'] | Select-Object -First 1)
            $expectedLen = (Get-Item $setup).Length
            if ($liveHead.StatusCode -ne 200 -or $liveLen -ne $expectedLen) {
              throw "Live mirror verification failed: status=$($liveHead.StatusCode) len=$liveLen expected=$expectedLen"
            }
            Write-Host "Verified live mirror installer: https://windchime.uliuli.cn/updates/WindChime-Setup-$version.exe ($liveLen bytes)"
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
          }
