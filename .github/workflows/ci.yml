name: package-and-example
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:check
      - run: npm ci --install-links
        working-directory: examples/next-sqlite
      - run: npm run setup && npm run db:init && npm run typecheck && npm run build
        working-directory: examples/next-sqlite
      - run: docker build -f examples/next-sqlite/Dockerfile -t windchime-example .
        if: matrix.node == 24
